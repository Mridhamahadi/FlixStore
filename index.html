<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flixstore | Premium Digital Products</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Colors/Fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        dark: '#0f172a',
                        darker: '#020617',
                        primary: '#3b82f6',
                        accent: '#a855f7',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        /* Glassmorphism Utilities */
        .glass-nav {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 10px 30px -10px rgba(168, 85, 247, 0.3);
            transform: translateY(-5px);
        }

        .glass-sidebar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Typography Gradients */
        .text-gradient {
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .text-gradient-alt {
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Background Glow Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
        }
    </style>
</head>
<body class="antialiased relative min-h-screen">

    <!-- Background Ambient Glows -->
    <div class="glow-orb bg-blue-600 w-96 h-96 top-0 left-0 -translate-x-1/2 -translate-y-1/2"></div>
    <div class="glow-orb bg-purple-600 w-[500px] h-[500px] top-1/3 right-0 translate-x-1/3"></div>
    <div class="glow-orb bg-cyan-600 w-80 h-80 bottom-0 left-1/4 translate-y-1/2"></div>

    <!-- Toast Notification (Replacing Alert) -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[100] bg-red-500/90 backdrop-blur text-white px-6 py-3 rounded-full shadow-lg shadow-red-500/20 transform -translate-y-24 opacity-0 transition-all duration-300 font-medium pointer-events-none">
        Notification Message
    </div>

    <!-- Header -->
    <header class="glass-nav fixed top-0 w-full z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-3xl font-extrabold tracking-tighter text-gradient uppercase">
                Flixstore
            </div>
            <button onclick="toggleCart()" class="relative group px-6 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full transition-all duration-300 flex items-center gap-2 overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500/20 to-purple-500/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <span class="font-semibold text-sm relative z-10 text-slate-200">Cart</span>
                <span id="cart-count" class="relative z-10 bg-gradient-to-r from-blue-500 to-purple-500 text-white text-xs font-bold px-2 py-0.5 rounded-full shadow-[0_0_10px_rgba(59,130,246,0.5)]">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="pt-32 pb-16 px-6 max-w-7xl mx-auto relative z-10">
        <div class="text-center max-w-3xl mx-auto mb-20">
            <h1 class="text-5xl md:text-6xl font-extrabold mb-6 tracking-tight text-white leading-tight">
                Unlock Premium <br />
                <span class="text-gradient">Digital Experiences</span>
            </h1>
            <p class="text-lg md:text-xl text-slate-400 font-light max-w-2xl mx-auto">
                Instant access to top-tier entertainment and productivity platforms. Quality products delivered directly to you.
            </p>
        </div>

        <div class="space-y-16">
            <!-- Section 1: Featured Collection -->
            <section>
                <div class="flex items-center gap-4 mb-8">
                    <h2 class="text-2xl font-bold text-white tracking-wide">Featured Collection</h2>
                    <div class="h-[1px] flex-grow bg-gradient-to-r from-white/10 to-transparent"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="featured-list">
                    <!-- Injected by JS -->
                </div>
            </section>

            <!-- Section 2: Entertainment -->
            <section>
                <div class="flex items-center gap-4 mb-8">
                    <h2 class="text-2xl font-bold text-white tracking-wide">Entertainment <span class="text-gradient-alt">Hub</span></h2>
                    <div class="h-[1px] flex-grow bg-gradient-to-r from-white/10 to-transparent"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="entertainment-list">
                    <!-- Injected by JS -->
                </div>
            </section>

            <!-- Section 3: All Products -->
            <section>
                <div class="flex items-center gap-4 mb-8">
                    <h2 class="text-2xl font-bold text-white tracking-wide">All Products</h2>
                    <div class="h-[1px] flex-grow bg-gradient-to-r from-white/10 to-transparent"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="all-products-list">
                    <!-- Injected by JS -->
                </div>
            </section>
        </div>
    </main>

    <!-- Slide-out Cart Sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[400px] glass-sidebar z-[100] transform translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] shadow-2xl flex flex-col">
        
        <!-- Cart Header -->
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-slate-900/50">
            <h2 class="text-2xl font-bold text-white">Your <span class="text-gradient">Cart</span></h2>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-white transition-colors p-2 rounded-full hover:bg-white/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Cart Items Container -->
        <div id="cart-items" class="flex-grow p-6 overflow-y-auto space-y-4">
            <!-- Injected by JS -->
        </div>

        <!-- Cart Footer -->
        <div class="p-6 border-t border-white/10 bg-slate-900/80 backdrop-blur-md">
            <div class="flex justify-between items-end mb-6">
                <span class="text-slate-400 font-medium text-lg">Total</span>
                <div class="text-3xl font-bold text-white">৳<span id="total-price">0.00</span></div>
            </div>
            
            <button onclick="checkoutWhatsApp()" class="w-full relative group px-6 py-4 bg-green-500/10 hover:bg-green-500/20 border border-green-500/50 rounded-xl transition-all duration-300 overflow-hidden shadow-[0_0_20px_rgba(34,197,94,0.1)] hover:shadow-[0_0_30px_rgba(34,197,94,0.3)]">
                <div class="absolute inset-0 bg-gradient-to-r from-green-400/20 to-emerald-500/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative z-10 flex items-center justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-green-400">
                        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.347-.272.297-1.04 1.016-1.04 2.479 0 1.463 1.065 2.876 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                    </svg>
                    <span class="font-bold text-green-400 text-lg">Checkout via WhatsApp</span>
                </div>
            </button>
        </div>
    </div>

    <!-- Overlay for cart -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[90] opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <!-- -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1OGG8izV5YpQMajWsNHZxPEBCyUNnzlM",
            authDomain: "flixstore-7945a.firebaseapp.com",
            projectId: "flixstore-7945a",
            storageBucket: "flixstore-7945a.firebasestorage.app",
            messagingSenderId: "227012172770",
            appId: "1:227012172770:web:c1ae4ba7ba9661ef40f7bb"
        };

        const app = initializeApp(firebaseConfig);
    </script>
    
    <!-- -->
    <script>
        // High-quality Unsplash source images replacing local assets
        const products = [
            { id: 1, name: "Netflix", price: 299.00, img: "netflix2.png" },
            { id: 2, name: "PrimeVideo", price: 150.00, img: "prime.png" },
            { id: 3, name: "Spotify", price: 250.00, img: "Spotify.png" },
            { id: 4, name: "ChatGpt", price: 499.00, img: "Chatgpt.png" },
            { id: 5, name: "Crunchyroll", price: 299.00, img: "Crunchyroll.png" },
            { id: 6, name: "Google One", price: 499.00, img: "Googleone.png" }
        ];

        let cart = [];

        // Helper function to calculate price with discounts
        function calculatePrice(basePrice, months) {
            if (months === 3) {
                return (basePrice * 3) * 0.90; // 10% discount for 3 months
            }
            return basePrice;
        }

        // Update price display dynamically on the card
        function updatePriceDisplay(productId, uniqueId) {
            const product = products.find(p => p.id === productId);
            const selectEl = document.getElementById(`validity-${uniqueId}`);
            const months = parseInt(selectEl.value);
            const newPrice = calculatePrice(product.price, months);
            
            document.getElementById(`price-display-${uniqueId}`).innerText = `৳${newPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        // Helper function to generate HTML for a product card with digital theme
        function createProductCardHTML(p, instancePrefix) {
            const uniqueId = `${instancePrefix}-${p.id}`;
            return `
                <div class="glass-card rounded-2xl p-4 flex flex-col group relative overflow-hidden">
                    <!-- Glow effect behind image -->
                    <div class="absolute top-4 left-4 right-4 h-48 bg-gradient-to-b from-blue-500/20 to-purple-500/20 blur-xl rounded-xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-0"></div>
                    
                    <div class="relative z-10 rounded-xl overflow-hidden mb-5 border border-white/5 bg-slate-800">
                        <img src="${p.img}" alt="${p.name}" class="w-full h-48 object-cover transform group-hover:scale-105 transition-transform duration-500 opacity-80 group-hover:opacity-100 mix-blend-lighten">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-60"></div>
                    </div>
                    
                    <div class="relative z-10 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-white mb-1 group-hover:text-blue-400 transition-colors">${p.name}</h3>
                            <div class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-3">
                                <span id="price-display-${uniqueId}">৳${p.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                            </div>
                            
                            <!-- Validity Selector -->
                            <div class="mb-5">
                                <label class="text-xs text-slate-400 mb-1.5 block uppercase tracking-wider font-semibold">Select Validity</label>
                                <div class="relative">
                                    <select id="validity-${uniqueId}" onchange="updatePriceDisplay(${p.id}, '${uniqueId}')" class="w-full bg-slate-900/80 border border-white/10 rounded-xl px-3 py-2.5 text-slate-200 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none appearance-none transition-all cursor-pointer">
                                        <option value="1">1 Month</option>
                                        <option value="3">3 Months (10% Off)</option>
                                    </select>
                                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <button onclick="addToCart(${p.id}, '${uniqueId}')" class="w-full relative overflow-hidden rounded-full py-3 bg-white/5 border border-white/10 hover:border-blue-500/50 hover:bg-blue-500/10 transition-all duration-300 font-semibold text-sm text-white group/btn">
                            <span class="relative z-10 flex justify-center items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                </svg>
                                Add to Cart
                            </span>
                            <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-600/40 to-purple-600/40 transform scale-x-0 group-hover/btn:scale-x-100 transition-transform origin-left duration-300"></div>
                        </button>
                    </div>
                </div>
            `;
        }

        // Render products into their specific sections based on exact original logic
        function renderProducts() {
            const featuredList = document.getElementById('featured-list');
            const featuredProducts = products.filter(p => p.name === "Netflix" || p.name === "PrimeVideo");
            featuredList.innerHTML = featuredProducts.map(p => createProductCardHTML(p, 'feat')).join('');

            const entertainmentList = document.getElementById('entertainment-list');
            const entertainmentProducts = products.filter(p => ["Netflix", "PrimeVideo", "Spotify", "Crunchyroll"].includes(p.name));
            entertainmentList.innerHTML = entertainmentProducts.map(p => createProductCardHTML(p, 'ent')).join('');

            const allProductsList = document.getElementById('all-products-list');
            allProductsList.innerHTML = products.map(p => createProductCardHTML(p, 'all')).join('');
        }

        function addToCart(productId, uniqueId) {
            const product = products.find(p => p.id === productId);
            const selectEl = document.getElementById(`validity-${uniqueId}`);
            const months = parseInt(selectEl.value);
            const finalPrice = calculatePrice(product.price, months);

            const cartItem = {
                ...product,
                cartItemId: Date.now() + Math.random(), // Unique ID for cart management
                months: months,
                price: finalPrice
            };
            
            cart.push(cartItem);
            updateCart();
            
            // Auto open sidebar on add
            const sidebar = document.getElementById('cart-sidebar');
            if(!sidebar.classList.contains('translate-x-0')) {
                toggleCart();
            }
        }

        function updateCart() {
            // Update counter with bounce effect
            const countEl = document.getElementById('cart-count');
            countEl.innerText = cart.length;
            countEl.classList.add('scale-150');
            setTimeout(() => countEl.classList.remove('scale-150'), 200);

            const cartItems = document.getElementById('cart-items');
            
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-500 gap-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                        <p class="font-medium text-center">Your digital cart is empty</p>
                    </div>`;
                document.getElementById('total-price').innerText = "0.00";
                return;
            }

            cartItems.innerHTML = cart.map((item, index) => `
                <div class="bg-white/5 border border-white/5 rounded-xl p-4 flex justify-between items-center group transition-colors hover:bg-white/10">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg overflow-hidden bg-slate-800 flex-shrink-0">
                            <img src="${item.img}" class="w-full h-full object-cover opacity-80" alt="${item.name}">
                        </div>
                        <div class="flex flex-col">
                            <span class="font-semibold text-slate-200">${item.name}</span>
                            <span class="text-xs text-slate-400">${item.months} Month${item.months > 1 ? 's' : ''}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-bold text-cyan-400">৳${item.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                        <button onclick="removeFromCart(${index})" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('total-price').innerText = total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            // Toggle sidebar translate classes
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                sidebar.classList.add('translate-x-0');
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                overlay.classList.add('opacity-100');
            } else {
                sidebar.classList.add('translate-x-full');
                sidebar.classList.remove('translate-x-0');
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        //        // Custom Toast system replacing standard alert()
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) {
                showToast("Your cart is empty! Please add items first.");
                return;
            }

            let message = "Hello Flixstore! I would like to order:\n\n";
            
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} (${item.months} Month${item.months > 1 ? 's' : ''}) - ৳${item.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}\n`;
            });

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            message += `\n*Total: ৳${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}*\n\nPlease let me know the bKash number to send the payment.`;

            const whatsappNumber = "8801343546958"; 
            const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
            
            window.open(whatsappURL, '_blank');
        }

        // Initialize store on load
        renderProducts();
        updateCart();
    </script>
</body>
</html>
